SYSTEM:
  DEVICE: "cuda:0"

DATA:
  DATASET_PATH: "paired_Mimic_vae_multi_nomic.pt"
  TEST_DATASET_PATH: "paired_Mimic_vae_multi_nomic_test.pt"

MODEL:
  CONDITIONER:
    TYPE: "foundation_jepa"
  FOUNDATION:
    EMBED_DIM: 256
    NUM_HEADS: 8
    FF_HIDDEN_SIZE: 1024
    NUM_LAYERS: 6
    TEXT_EMBED_DIM: 768
    PATIENT_INFO_SIZE: 3
    MASK_RATIO: 0.5
    MASK_SPAN: 8
    PREDICTOR_HIDDEN_SIZE: 512
    EMA_DECAY: 0.996

TRAIN:
  TASK: "foundation"
  EPOCHS: 50
  BATCH_SIZE: 2048
  MINI_BATCH_SIZE: 256
  EVAL_BATCH_SIZE: 256
  LR: 1.0e-4
  WEIGHT_DECAY: 1.0e-3
  LOAD_PRETRAIN: ""

CHECKPOINTS:
  CONDITIONER_PATH: "checkpoints/conditioner_best.pth"
