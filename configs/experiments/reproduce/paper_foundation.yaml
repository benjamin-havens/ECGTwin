SYSTEM:
  DEVICE: "cuda:0"
  MATMUL_PRECISION: "high"

PATHS:
  CHECKPOINTS_DIR: "checkpoints"

DATA:
  DATASET_PATH: "paired_Mimic_vae_multi_nomic.pt"
  TEST_DATASET_PATH: "paired_Mimic_vae_multi_nomic_test.pt"

MODEL:
  NAME: "DiT_ECGTwin"
  EXP_NAME: "paper_foundation"
  DESCRIPTION: "ECGTwin reproduction with JEPA-style foundation conditioner"
  USE_VAE_LATENT: true
  MIX_TEXT: false
  CONDITIONER:
    TYPE: "foundation_jepa"
  FOUNDATION:
    EMBED_DIM: 256
    NUM_HEADS: 8
    FF_HIDDEN_SIZE: 1024
    NUM_LAYERS: 6
    TEXT_EMBED_DIM: 768
    PATIENT_INFO_SIZE: 3
    MASK_RATIO: 0.5
    MASK_SPAN: 8
    PREDICTOR_HIDDEN_SIZE: 512
    EMA_DECAY: 0.996
  DIT:
    HIDDEN_SIZE: 256
    DEPTH: 7
    NUM_HEADS: 8
    PATIENT_INFO_SIZE: 3
  CLIP:
    EMBED_DIM: 64
    TEXT_EMBED_DIM: 768

CHECKPOINTS:
  VAE_PATH: "checkpoints/vae_model.pth"
  CONDITIONER_PATH: "checkpoints/conditioner_best.pth"
  NOISE_PREDICTOR_PATH: "checkpoints/ECGTwin_DiT.pth"
  CLIP_PATH: "checkpoints/clip_1/clip_best.pth"

REPRO:
  RUN_NAME: "paper_foundation"
  STAGES:
    - "vae"
    - "preprocess"
    - "text_embed"
    - "pair"
    - "foundation"
    - "diffusion"
    - "clip"
    - "generate_batch"
    - "privacy"
    - "pecg_generate"
    - "pecg_train"
    - "pecg_test"
    - "compare"
  USE_EXISTING_MODEL_STAGES:
    - "vae"

REPORT:
  PAPER_PDF_PATH: "Lai et al. - 2025 - ECGTwin Personalized ECG Generation Using Controllable Diffusion Model.pdf"
